services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gimmeajob
      POSTGRES_PASSWORD: gimmeajob_secret
      POSTGRES_DB: gimmeajob
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gimmeajob"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://gimmeajob:gimmeajob_secret@postgres:5432/gimmeajob?schema=public
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:3000
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      DATA_DIR: /app/data
      TEMPLATES_DIR: /app/templates
      RESUMES_DIR: /app/resumes
      CONFIG_PATH: /app/config/config.json
      LOGS_DIR: /app/logs
    volumes:
      - ../data:/app/data:ro
      - ../templates:/app/templates:ro
      - ../resumes:/app/resumes:ro
      - ../config:/app/config:ro
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gimmeajob:gimmeajob_secret@postgres:5432/gimmeajob?schema=public
      REDIS_URL: redis://redis:6379
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      DATA_DIR: /app/data
      TEMPLATES_DIR: /app/templates
      RESUMES_DIR: /app/resumes
      CONFIG_PATH: /app/config/config.json
      LOGS_DIR: /app/logs
    volumes:
      - ../data:/app/data:ro
      - ../templates:/app/templates:ro
      - ../resumes:/app/resumes:ro
      - ../config:/app/config:ro
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
